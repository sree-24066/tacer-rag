# ==============================================================
# TACER-RAG: Type-Aware and Confidence-Calibrated Hallucination
# Detection and Evidence-Constrained Correction for RAG
# ==============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacer-rag"
version = "0.1.0"
description = "Type-Aware and Confidence-Calibrated Hallucination Detection and Evidence-Constrained Correction for Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "TACER-RAG Research Team" }
]
keywords = ["RAG", "hallucination", "NLP", "ModernBERT", "factuality"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core ML
    "torch>=2.2.0",
    "transformers>=4.47.0",
    "datasets>=2.19.0",
    "evaluate>=0.4.0",
    "accelerate>=0.30.0",
    "sentencepiece>=0.1.99",
    # Data
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    # Visualisation
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    # Config and utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    # Verification
    "nltk>=3.8.0",
    # App
    "streamlit>=1.35.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.8",
    "ipykernel>=6.29",
    "jupyter>=1.0.0",
    "notebook>=7.0",
]
ollama = ["ollama>=0.2.0"]
openai = ["openai>=1.30.0"]
wandb = ["wandb>=0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
